[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ═══════════════════════════════════════════════════════════
# API → Netlify Function redirect
# This must come BEFORE the SPA fallback
# ═══════════════════════════════════════════════════════════
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/upload-image"
  to = "/.netlify/functions/upload-image"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# ═══════════════════════════════════════════════════════════
# Admin panel
# ═══════════════════════════════════════════════════════════
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# ═══════════════════════════════════════════════════════════
# SPA fallback for hash routing (last)
# ═══════════════════════════════════════════════════════════
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
