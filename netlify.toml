[build]
  command = "node generate-pages.js"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--ignore-scripts"

# ═══════════════════════════════════════════════════════════
# API → Netlify Function redirect
# This must come BEFORE the SPA fallback
# ═══════════════════════════════════════════════════════════
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/upload-image"
  to = "/.netlify/functions/upload-image"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# ═══════════════════════════════════════════════════════════
# Admin panel
# ═══════════════════════════════════════════════════════════
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# ═══════════════════════════════════════════════════════════
# Static pages (generated by generate-pages.js)
# ═══════════════════════════════════════════════════════════
[[redirects]]
  from = "/destinations"
  to = "/pages/destinations.html"
  status = 200
  force = true

[[redirects]]
  from = "/packages"
  to = "/pages/packages.html"
  status = 200
  force = true

[[redirects]]
  from = "/why-us"
  to = "/pages/why-us.html"
  status = 200
  force = true

[[redirects]]
  from = "/services"
  to = "/pages/services.html"
  status = 200
  force = true

[[redirects]]
  from = "/contact"
  to = "/pages/contact.html"
  status = 200
  force = true

[[redirects]]
  from = "/plan-your-trip"
  to = "/pages/plan-your-trip.html"
  status = 200
  force = true

# ═══════════════════════════════════════════════════════════
# Journey detail pages (SPA routing via index.html)
# ═══════════════════════════════════════════════════════════
[[redirects]]
  from = "/journeys/*"
  to = "/index.html"
  status = 200

# ═══════════════════════════════════════════════════════════
# SPA fallback (last)
# ═══════════════════════════════════════════════════════════
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
