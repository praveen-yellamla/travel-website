[build]
  command = "npm run build"
  publish = "."
  environment = { NODE_VERSION = "20" }

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-optional"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# SPA fallback for hash routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
